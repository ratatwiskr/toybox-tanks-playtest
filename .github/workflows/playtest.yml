name: Publish playtest

run-name: Playtest ${{ inputs.source_branch }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch in ratatwiskr/toybox-tanks (not a fork or PR number)'
        required: true
        default: main
        type: string

permissions:
  contents: read

# One selected build at a time; never cancel an active deployment or live smoke.
concurrency:
  group: playtest-site
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the selected public source branch
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          refs="$(git ls-remote --exit-code --refs https://github.com/ratatwiskr/toybox-tanks.git "refs/heads/$SOURCE_BRANCH")"
          sha="$(printf '%s\n' "$refs" | awk -v ref="refs/heads/$SOURCE_BRANCH" '$2 == ref { print $1 }')"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact game revision without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: ratatwiskr/toybox-tanks
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Install verification browsers
        working-directory: source
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Full verification of selected source
        working-directory: source
        run: npm run verify

      - name: Cross-browser production release smoke
        working-directory: source
        run: npm run test:browsers

      - name: Prepare production artifact and source provenance
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s dist/index.html
          printf '%s\n' "$SOURCE_SHA" > dist/deployed-commit.txt
          jq -n \
            --arg repository 'ratatwiskr/toybox-tanks' \
            --arg branch "$SOURCE_BRANCH" \
            --arg sha "$SOURCE_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository: $repository, branch: $branch, sha: $sha, run: $run}' \
            > dist/playtest-source.json
          printf 'Verified game source: `ratatwiskr/toybox-tanks@%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-verification
          path: |
            source/playwright-report/
            source/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the isolated Pages site
        uses: actions/configure-pages@v5

      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment pending live verification
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          printf 'Playtest deployed: %s\n\nGame source: `%s`\n\nLive smoke is still required.\n' \
            "$PAGE_URL" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAGES_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      PAGES_EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Checkout smoke tests from the verified game revision
        uses: actions/checkout@v4
        with:
          repository: ratatwiskr/toybox-tanks
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the actual published playtest site
        run: npm run test:pages

      - name: Record verified playtest URL
        run: |
          printf 'Live playtest smoke passed: %s\n\nGame source: `%s`\n' \
            "$PAGES_BASE_URL" "$PAGES_EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve live smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-pages-smoke
          path: |
            playwright-report/pages/
            test-results/pages/
          if-no-files-found: ignore
          retention-days: 14
